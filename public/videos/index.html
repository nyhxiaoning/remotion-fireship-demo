<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生成视频列表</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0f14;color:#e6edf3}
    header{position:sticky;top:0;background:#0f1620;border-bottom:1px solid #1f2a37;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    header h1{margin:0;font-size:16px;font-weight:600}
    header a{color:#8ab4ff;text-decoration:none;font-size:14px}
    .container{max-width:1100px;margin:0 auto;padding:20px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .input{background:#0f1620;border:1px solid #1f2a37;border-radius:8px;padding:8px 10px;color:#e6edf3}
    .btn{background:#1e293b;border:1px solid #334155;color:#e6edf3;padding:8px 12px;border-radius:8px;cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:#0f1620;border:1px solid #1f2a37;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
    .thumb{width:100%;aspect-ratio:16/9;background:#0b0f14;object-fit:cover}
    .meta{padding:12px 12px 6px 12px}
    .title{font-size:14px;margin:0 0 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sub{font-size:12px;color:#94a3b8;display:flex;gap:10px;flex-wrap:wrap}
    .actions{display:flex;gap:8px;padding:12px;border-top:1px solid #1f2a37}
    .link{flex:1;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 10px;color:#e6edf3;text-decoration:none}
    .empty,.error,.loading{padding:40px;text-align:center;color:#94a3b8}
    .pager{display:flex;gap:8px;justify-content:center;margin-top:16px}
    .badge{display:inline-block;border:1px solid #334155;background:#111827;color:#9ca3af;border-radius:6px;padding:2px 6px;font-size:11px}
  </style>
</head>
<body>
  <header>
    <h1>生成视频列表</h1>
    <a href="/">返回预览</a>
  </header>
  <div class="container">
    <div class="controls">
      <input id="search" class="input" placeholder="按标题搜索" />
      <select id="pageSize" class="input">
        <option value="12">每页 12</option>
        <option value="24">每页 24</option>
        <option value="48">每页 48</option>
      </select>
      <button id="refresh" class="btn">刷新</button>
    </div>
    <div id="status" class="loading">加载中…</div>
    <div id="grid" class="grid" style="display:none;"></div>
    <div id="pager" class="pager" style="display:none;">
      <button id="prev" class="btn">上一页</button>
      <span id="pageInfo" class="badge"></span>
      <button id="next" class="btn">下一页</button>
    </div>
  </div>
  <script>
    const apiBase = '/api/videos';
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const pagerEl = document.getElementById('pager');
    const pageInfoEl = document.getElementById('pageInfo');
    const searchEl = document.getElementById('search');
    const pageSizeEl = document.getElementById('pageSize');
    const refreshEl = document.getElementById('refresh');
    const prevEl = document.getElementById('prev');
    const nextEl = document.getElementById('next');

    let page = 1;
    let total = 0;
    let pageSize = parseInt(localStorage.getItem('videos_page_size') || '12', 10);
    let q = '';
    pageSizeEl.value = String(pageSize);

    function fmtDuration(sec){ if(!sec && sec!==0) return '-'; const s=Math.floor(sec%60).toString().padStart(2,'0'); const m=Math.floor((sec/60)%60).toString().padStart(2,'0'); const h=Math.floor(sec/3600); return h?`${h}:${m}:${s}`:`${m}:${s}` }
    function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString() }

    async function fetchVideos(){
      try{
        statusEl.style.display='block'; statusEl.className='loading'; statusEl.textContent='加载中…';
        gridEl.style.display='none'; pagerEl.style.display='none';
        const url = new URL(apiBase, window.location.origin);
        url.searchParams.set('page', String(page));
        url.searchParams.set('pageSize', String(pageSize));
        if(q) url.searchParams.set('q', q);
        const res = await fetch(url.toString(), { headers: { 'Accept': 'application/json' }});
        if(!res.ok) throw new Error('接口返回错误: ' + res.status);
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : (Array.isArray(data) ? data : []);
        total = data.total ?? items.length;
        render(items);
      }catch(e){
        statusEl.style.display='block'; statusEl.className='error'; statusEl.textContent='加载失败：' + (e && e.message ? e.message : e);
      }
    }

    function render(items){
      if(!items || items.length===0){
        statusEl.style.display='block'; statusEl.className='empty'; statusEl.textContent='暂无视频';
        gridEl.style.display='none'; pagerEl.style.display='none';
        return;
      }
      gridEl.innerHTML = '';
      for(const it of items){
        const card = document.createElement('div');
        card.className = 'card';
        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.src = it.thumbnailUrl || 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#0b0f14"/><path d="M270 120l160 60-160 60z" fill="#8ab4ff"/></svg>`);
        thumb.alt = it.title || it.id || '';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const title = document.createElement('h3');
        title.className = 'title';
        title.textContent = it.title || it.id || '未命名';
        const sub = document.createElement('div');
        sub.className = 'sub';
        const d1 = document.createElement('span'); d1.textContent = fmtDuration(it.duration);
        const d2 = document.createElement('span'); d2.textContent = fmtDate(it.createdAt);
        const d3 = document.createElement('span'); d3.textContent = (it.format || '').toUpperCase();
        sub.appendChild(d1); sub.appendChild(d2); sub.appendChild(d3);
        meta.appendChild(title); meta.appendChild(sub);
        const actions = document.createElement('div');
        actions.className = 'actions';
        const play = document.createElement('a');
        play.className = 'link';
        play.textContent = '播放';
        play.href = it.url || '#';
        play.target = '_blank';
        const dl = document.createElement('a');
        dl.className = 'link';
        dl.textContent = '下载';
        dl.href = it.url || '#';
        dl.download = '';
        const cp = document.createElement('a');
        cp.className = 'link';
        cp.textContent = '复制链接';
        cp.href = '#';
        cp.addEventListener('click', (ev)=>{ev.preventDefault(); if(it.url){ navigator.clipboard.writeText(new URL(it.url, window.location.origin).toString()); cp.textContent='已复制'; setTimeout(()=>cp.textContent='复制链接',1200);} });
        actions.appendChild(play); actions.appendChild(dl); actions.appendChild(cp);
        card.appendChild(thumb); card.appendChild(meta); card.appendChild(actions);
        gridEl.appendChild(card);
      }
      statusEl.style.display='none';
      gridEl.style.display='grid';
      pagerEl.style.display='flex';
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      pageInfoEl.textContent = `第 ${page} / ${totalPages} 页`;
      prevEl.disabled = page<=1;
      nextEl.disabled = page>=totalPages;
    }

    searchEl.addEventListener('input', (e)=>{ q = e.target.value.trim(); page = 1; fetchVideos(); });
    pageSizeEl.addEventListener('change', (e)=>{ pageSize = parseInt(e.target.value,10)||12; localStorage.setItem('videos_page_size', String(pageSize)); page = 1; fetchVideos(); });
    refreshEl.addEventListener('click', ()=> fetchVideos());
    prevEl.addEventListener('click', ()=>{ if(page>1){ page--; fetchVideos(); }});
    nextEl.addEventListener('click', ()=>{ page++; fetchVideos(); });

    fetchVideos();
  </script>
</body>
</html>
